name: '[BETA] Create YouTube Plus app'

on:
  workflow_dispatch:
    inputs:
      enable_youpip:
        description: "Integrate YouPiP"
        type: boolean
        required: true
        default: false

      enable_ytuhd:
        description: "Integrate YTUHD"
        type: boolean
        required: true
        default: false

      enable_yq:
        description: "Integrate YouQuality"
        type: boolean
        required: true
        default: false

      enable_ryd:
        description: "Integrate Return YouTube Dislikes"
        type: boolean
        required: true
        default: false

      enable_ytabc:
        description: "Integrate YTABConfig"
        type: boolean
        required: true
        default: false

      enable_demc:
        description: "Integrate DontEatMyContent"
        type: boolean
        required: true
        default: false

      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      tweak_url:
        description: "URL to a rootful iphoneos-arm YouTube Plus tweak DEB"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      info_note:
        description: "TIP: Learn more about integrations in the README via the link below"
        default: "https://github.com/dayanch96/YTLite#tweak-integration-details"
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      enable_youpip: ${{ inputs.enable_youpip }}
      enable_ytuhd: ${{ inputs.enable_ytuhd }}
      enable_yq: ${{ inputs.enable_yq }}
      enable_ryd: ${{ inputs.enable_ryd }}
      enable_ytabc: ${{ inputs.enable_ytabc }}
      enable_demc: ${{ inputs.enable_demc }}
      tweak_url: ${{ inputs.tweak_url }}

  package:
    name: Package IPA (Beta)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: build-tweaks
    permissions:
      contents: read

    steps:
      - name: Checkout workflow validators
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download built debs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@15951963797b16aa43fa0b093b45cd2db0319fdd # v1
        with:
          exclude_inputs: bundle_id,display_name,enable_demc,enable_ryd,enable_ytabc,enable_youpip,enable_yq,enable_ytuhd,info_note

      - name: Download and validate IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          curl --fail --location --max-filesize 2147483648 --retry 3 --show-error --silent "$IPA_URL" --output youtube.ipa
          python3 .github/scripts/verify_build.py custom-source-ipa --file youtube.ipa

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/740d3716dcd98c20c000f12cdb88f1f0b2a533a4.zip

      - name: Inject tweaks into IPA
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          tweaks=(ytplus.deb OpenYoutubeSafariExtension.appex)
          for f in ./*.deb; do
            [ -f "$f" ] && [ "$f" != "./ytplus.deb" ] && tweaks+=("$f")
          done
          cyan -i youtube.ipa -o YouTubePlus_Beta.ipa -uwef "${tweaks[@]}" -n "$DISPLAY_NAME" -b "$BUNDLE_ID"

      - name: Validate packaged IPA
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          python3 .github/scripts/verify_build.py custom-packaged-ipa \
            --file YouTubePlus_Beta.ipa \
            --bundle-id "$BUNDLE_ID" \
            --deb ytplus.deb

      - name: Stage validated IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-beta-ipa
          path: YouTubePlus_Beta.ipa
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create draft beta release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: package
    permissions:
      contents: write

    steps:
      - name: Download validated IPA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packaged-beta-ipa

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ytp-beta-${{ github.run_id }}
          name: YouTubePlus Beta (${{ github.run_number }})
          files: YouTubePlus_Beta.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
