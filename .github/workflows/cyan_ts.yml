name: Generate TrollFools/Cyan files

on:
  workflow_dispatch:
    inputs:
      create_cyan:
        description: "Generate .cyan file"
        type: boolean
        required: true
        default: true

      create_tf:
        description: "Generate .zip for TrollFools"
        type: boolean
        required: true
        default: true

      enable_youpip:
        description: "Integrate YouPiP"
        type: boolean
        required: true
        default: false

      enable_ytuhd:
        description: "Integrate YTUHD"
        type: boolean
        required: true
        default: false

      enable_yq:
        description: "Integrate YouQuality"
        type: boolean
        required: true
        default: false

      enable_ryd:
        description: "Integrate Return YouTube Dislikes"
        type: boolean
        required: true
        default: false

      enable_ytabc:
        description: "Integrate YTABConfig"
        type: boolean
        required: true
        default: false

      enable_demc:
        description: "Integrate DontEatMyContent"
        type: boolean
        required: true
        default: false

      tweak_version:
        description: "YTPlus release: 5.2b4 is free; 5.2.2 requires an active subscription"
        default: "5.2b4"
        required: true
        type: choice
        options:
          - "5.2b4"
          - "5.2.2"

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      enable_youpip: ${{ inputs.enable_youpip }}
      enable_ytuhd: ${{ inputs.enable_ytuhd }}
      enable_yq: ${{ inputs.enable_yq }}
      enable_ryd: ${{ inputs.enable_ryd }}
      enable_ytabc: ${{ inputs.enable_ytabc }}
      enable_demc: ${{ inputs.enable_demc }}
      tweak_version: ${{ inputs.tweak_version }}

  package:
    name: Generate Cyan/TrollFools
    runs-on: macos-latest
    timeout-minutes: 30
    needs: build-tweaks
    permissions:
      contents: read
    outputs:
      files: ${{ steps.filelist.outputs.files }}

    steps:
      - name: Checkout workflow validators
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download built debs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: Check Inputs
        if: ${{ !inputs.create_cyan && !inputs.create_tf }}
        run: |
          echo "::error::Select at least one output format."
          exit 1

      - name: Install Dependencies
        run: brew install dpkg

      - name: Install cyan
        if: ${{ inputs.create_cyan }}
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/740d3716dcd98c20c000f12cdb88f1f0b2a533a4.zip

      - name: Generate .cyan file
        if: ${{ inputs.create_cyan }}
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          TWEAK_VERSION: ${{ inputs.tweak_version }}
        run: |
          tweaks=(ytplus.deb OpenYoutubeSafariExtension.appex)
          for f in ./*.deb; do
            [ -f "$f" ] && [ "$f" != "./ytplus.deb" ] && tweaks+=("$f")
          done
          cgen -uwef "${tweaks[@]}" -n "$DISPLAY_NAME" -b "$BUNDLE_ID" -o "cyan_YouTubePlus_${TWEAK_VERSION}.cyan"

      - name: Validate .cyan file
        if: ${{ inputs.create_cyan }}
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          TWEAK_VERSION: ${{ inputs.tweak_version }}
        run: |
          python3 .github/scripts/verify_build.py cyan \
            --file "cyan_YouTubePlus_${TWEAK_VERSION}.cyan" \
            --version "$TWEAK_VERSION" \
            --bundle-id "$BUNDLE_ID" \
            --display-name "$DISPLAY_NAME"

      - name: Generate .zip file for TrollFools
        if: ${{ inputs.create_tf }}
        env:
          TWEAK_VERSION: ${{ inputs.tweak_version }}
        run: |
          mkdir -p ytp_tf
          for f in *.deb; do
            if [ -f "$f" ]; then
              mkdir -p tmp_deb
              dpkg-deb -x "$f" tmp_deb
              find tmp_deb -type f -name "*.dylib" -exec cp -R {} ytp_tf/ \;
              find tmp_deb -type d -name "*.bundle" -exec cp -R {} ytp_tf/ \;
              rm -rf tmp_deb
            fi
          done
          cd ytp_tf
          zip -r "../TrollFools_YouTubePlus_${TWEAK_VERSION}.zip" .
          cd ..
          rm -rf ytp_tf

      - name: Validate TrollFools file
        if: ${{ inputs.create_tf }}
        env:
          TWEAK_VERSION: ${{ inputs.tweak_version }}
        run: |
          python3 .github/scripts/verify_build.py trollfools \
            --file "TrollFools_YouTubePlus_${TWEAK_VERSION}.zip" \
            --version "$TWEAK_VERSION"

      - name: Set output file list
        id: filelist
        env:
          CREATE_CYAN: ${{ inputs.create_cyan }}
          CREATE_TF: ${{ inputs.create_tf }}
          TWEAK_VERSION: ${{ inputs.tweak_version }}
        run: |
          files=""
          [ "$CREATE_CYAN" = "true" ] && files="${files}cyan_YouTubePlus_${TWEAK_VERSION}.cyan"$'\n'
          [ "$CREATE_TF" = "true" ]   && files="${files}TrollFools_YouTubePlus_${TWEAK_VERSION}.zip"$'\n'
          {
            echo "files<<EOF"
            printf '%s' "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stage validated files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-tools
          path: ${{ steps.filelist.outputs.files }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create draft tools release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: package
    permissions:
      contents: write

    steps:
      - name: Download validated files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packaged-tools

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ytp-tools-${{ github.run_id }}
          name: YouTubePlus v${{ inputs.tweak_version }}_cyan_trollfools (${{ github.run_number }})
          files: ${{ needs.package.outputs.files }}
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
